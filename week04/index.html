<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo for Advanced CSS</title>
    <style>
        :root{
            --primary-color: rgb(88, 123, 193);
        }
        .btn{
            border-radius: 20px;
            border: 1px solid #ccc;
            padding: 10px 20px;
            box-shadow: 10px 5px 5px black;
        }
        header,footer{
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
        }

        #hero{
            min-height: 400px;
            background-image: url('https://plus.unsplash.com/premium_photo-1770210016839-131de07b2235?q=80&w=1748&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
        }
    </style>
</head>
<body>
   <header>Header</header>
   <section id="hero">
    <h1>Advanced CSS Demo</h1>
    </section>

    <button class="btn">Click Me</button>
    <footer>
        Footer
    </footer>
</body>
</html>
